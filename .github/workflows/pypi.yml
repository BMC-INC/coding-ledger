name: Publish to PyPI
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Already validated GitHub release tag (for example v1.0.1)
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download validated release distributions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          gh release download "$RELEASE_TAG" --dir dist --pattern '*.whl' --pattern '*.tar.gz' --pattern SHA256SUMS
          sha256sum -c dist/SHA256SUMS
          rm dist/SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@release/v1
