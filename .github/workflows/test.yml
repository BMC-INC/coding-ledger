name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m py_compile coding_ledger.py tests/test_coding_ledger.py
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Build and verify installed offline assets
        run: |
          python -m pip wheel . --no-deps --wheel-dir dist
          python -m venv "$RUNNER_TEMP/ledger-install"
          "$RUNNER_TEMP/ledger-install/bin/python" -m pip install --no-deps dist/*.whl
          python scripts/smoke-installed.py "$RUNNER_TEMP/ledger-install/bin/coding-ledger"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/ledger-install/bin/coding-ledger" --help
          "$RUNNER_TEMP/ledger-install/bin/python" -c 'import coding_ledger; tag = coding_ledger.chartjs_tag(); assert "Chart.js" in tag; assert "<script src=" not in tag'
