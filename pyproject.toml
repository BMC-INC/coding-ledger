[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-ledger"
version = "1.0.0"
description = "Local-first record of your coding work: hours, attribution, and AI ROI from receipts. Zero dependencies."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "james benton" }]
keywords = ["ai", "roi", "analytics", "claude", "codex", "coding", "local-first"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]

[project.scripts]
coding-ledger = "coding_ledger:main"

[project.urls]
Homepage = "https://github.com/BMC-INC/coding-ledger"

[tool.setuptools]
py-modules = ["coding_ledger"]
